<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Military Grade Vault</title>
    <style>
        :root { --bg: #0a0a0c; --surface: #16161a; --primary: #00ff41; /* Hacker Green */ --text: #ffffff; --danger: #ff4d4d; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .screen { display: none; padding: 25px; flex-direction: column; height: 100%; box-sizing: border-box; }
        .active { display: flex; }
        input { background: #1c1c24; border: 1px solid #333; color: var(--primary); padding: 15px; border-radius: 12px; margin-bottom: 12px; width: 100%; box-sizing: border-box; font-size: 16px; outline: none; }
        input:focus { border-color: var(--primary); }
        button { background: var(--primary); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: bold; margin-bottom: 10px; cursor: pointer; width: 100%; font-size: 16px; transition: 0.3s; }
        button:active { transform: scale(0.98); opacity: 0.8; }
        .card { background: var(--surface); padding: 18px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        .fab { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; border-radius: 50%; background: var(--primary); color: #000; font-size: 35px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.6); cursor: pointer; }
    </style>
</head>
<body>

    <div id="setupScreen" class="screen active">
        <h1 style="color:var(--primary)">Initialize Vault</h1>
        <p style="color:#888;">Set a strong security question. If you forget the answer, your data is GONE forever.</p>
        <input type="text" id="setupQ" placeholder="Security Question">
        <input type="password" id="setupA" placeholder="Master Answer" autocomplete="off">
        <button onclick="doSetup()">ENCRYPT & CREATE</button>
        <button style="background:#222; color:white;" onclick="restoreFromCloud()">📂 RESTORE FROM CLOUD</button>
    </div>

    <div id="loginScreen" class="screen">
        <h1 id="loginQ" style="color:var(--primary)">...</h1>
        <input type="password" id="loginA" placeholder="Answer" autocomplete="off">
        <button onclick="doLogin()">UNLOCK VAULT</button>
        <button style="background:#222; color:white;" onclick="restoreFromCloud()">📂 RESTORE FROM CLOUD</button>
    </div>

    <div id="dashScreen" class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 style="margin:0; letter-spacing:1px;">SECURE VAULT</h2>
            <button onclick="location.reload()" style="width:auto; padding:8px 15px; margin:0; background:transparent; color:var(--danger); border:1px solid var(--danger);">LOCK</button>
        </div>
        
        <input type="text" id="search" placeholder="🔍 Search Database..." oninput="render()">
        <button onclick="syncToCloud()" id="syncBtn" style="background:#0066ff; color:white;">☁️ SYNC TO ENCRYPTED CLOUD</button>
        
        <div id="list" style="flex:1; overflow-y:auto; margin-top:10px;"></div>
        <div class="fab" onclick="showAdd()">+</div>
    </div>

    <div id="addScreen" class="screen">
        <h2>Add Entry</h2>
        <input type="text" id="nSite" placeholder="Site/Service Name">
        <input type="text" id="nUser" placeholder="Username/Email">
        <input type="text" id="nPass" placeholder="Password">
        <button onclick="saveEntry()">PROTECT RECORD</button>
        <button style="background:#222; color:white;" onclick="showDash()">CANCEL</button>
    </div>

    <script>
        const SB_URL = "https://qpfvtkyukvpbakm.supabase.co";
        const SB_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwZnZ0a3l1a3ZwYmFrbWNnbm1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzOTUxMzEsImV4cCI6MjA4Njk3MTEzMX0.9bcDnUc2kmAMKwCbitgkWTmq7NpjYAdHwlFb8GiuuDM";
        const DB_KEY = "vault_v1";
        
        let db = [], key = null, question = "";

        window.onload = () => {
            const local = localStorage.getItem(DB_KEY);
            if(local) {
                const p = JSON.parse(local);
                question = p.q;
                document.getElementById('loginQ').innerText = question;
                show('loginScreen');
            }
        };

        // MILITARY GRADE KEY DERIVATION (PBKDF2 with 600k iterations)
        async function genKey(pwd) {
            const enc = new TextEncoder();
            const km = await crypto.subtle.importKey("raw", enc.encode(pwd), {name:"PBKDF2"}, false, ["deriveKey"]);
            return crypto.subtle.deriveKey({
                name:"PBKDF2", 
                salt:enc.encode("security184_ultra_salt"), 
                iterations:600000, 
                hash:"SHA-256"
            }, km, {name:"AES-GCM", length:256}, false, ["encrypt", "decrypt"]);
        }

        async function encrypt(data) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const enc = await crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, key, new TextEncoder().encode(JSON.stringify(data)));
            return { iv: Array.from(iv), d: Array.from(new Uint8Array(enc)) };
        }

        async function decrypt(pack) {
            try {
                const dec = await crypto.subtle.decrypt({name:"AES-GCM", iv:new Uint8Array(pack.iv)}, key, new Uint8Array(pack.d));
                return JSON.parse(new TextDecoder().decode(dec));
            } catch(e) { return null; }
        }

        async function doSetup() {
            question = document.getElementById('setupQ').value;
            const ans = document.getElementById('setupA').value;
            if(!question || !ans) return alert("Security fields cannot be empty.");
            key = await genKey(ans);
            db = []; await saveLocal(); showDash();
        }

        async function doLogin() {
            const ans = document.getElementById('loginA').value;
            if(!ans) return;
            key = await genKey(ans);
            const data = JSON.parse(localStorage.getItem(DB_KEY)).data;
            const res = await decrypt(data);
            if(res) { db = res; showDash(); } else alert("ACCESS DENIED: Incorrect Answer.");
        }

        async function saveLocal() {
            const enc = await encrypt(db);
            localStorage.setItem(DB_KEY, JSON.stringify({ q: question, data: enc }));
            render();
        }

        async function saveEntry() {
            db.push({ id: Date.now(), s: document.getElementById('nSite').value, u: document.getElementById('nUser').value, p: document.getElementById('nPass').value });
            await saveLocal(); showDash();
            document.getElementById('nSite').value = ""; document.getElementById('nUser').value = ""; document.getElementById('nPass').value = "";
        }

        async function syncToCloud() {
            const btn = document.getElementById('syncBtn'); btn.innerText = "🛡️ SECURING...";
            const local = JSON.parse(localStorage.getItem(DB_KEY));
            try {
                const res = await fetch(`${SB_URL}/rest/v1/vault`, {
                    method: 'POST',
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: 'me', encrypted_data: JSON.stringify(local.data), question: local.q })
                });
                if(res.ok) btn.innerText = "🔒 CLOUD SYNCED";
                else throw new Error();
            } catch(e) { alert("Sync Failed! Ensure RLS is disabled in Supabase."); btn.innerText = "❌ ERROR"; }
        }

        async function restoreFromCloud() {
            try {
                const res = await fetch(`${SB_URL}/rest/v1/vault?user_id=eq.me&select=*&order=id.desc&limit=1`, { headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` } });
                const rows = await res.json();
                if(rows.length) {
                    localStorage.setItem(DB_KEY, JSON.stringify({ q: rows[0].question, data: JSON.parse(rows[0].encrypted_data) }));
                    location.reload();
                } else alert("No cloud data found.");
            } catch(e) { alert("Restore failed."); }
        }

        function show(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); if(id=='dashScreen') render(); }
        function showDash() { show('dashScreen'); }
        function showAdd() { show('addScreen'); }
        function render() {
            const list = document.getElementById('list'), term = document.getElementById('search').value.toLowerCase();
            list.innerHTML = "";
            db.filter(i => i.s.toLowerCase().includes(term)).forEach(i => {
                const d = document.createElement('div'); d.className='card';
                d.innerHTML = `<div><b style="color:var(--primary)">${i.s}</b><br><small style="color:#888;">${i.u}</small></div><button style="width:auto;margin:0;padding:10px 15px;background:#333;color:white;" onclick="copyPass('${i.p}')">COPY</button>`;
                list.appendChild(d);
            });
        }
        function copyPass(p) { navigator.clipboard.writeText(p); alert("Password Copied to Clipboard."); }
    </script>
</body>
</html>
