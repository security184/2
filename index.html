<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vault Pro: Secure</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root { --bg: #050505; --surface: #121212; --primary: #00e5ff; --text: #ffffff; --font: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); font-family: var(--font); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .screen { display: none; padding: 25px; flex-direction: column; height: 100%; box-sizing: border-box; animation: slideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .active { display: flex; }

        h1, h2 { font-weight: 800; margin-top: 0; }
        
        .input-wrapper { position: relative; margin-bottom: 15px; }
        input { background: var(--surface); border: 1px solid #333; color: white; padding: 18px; border-radius: 14px; width: 100%; box-sizing: border-box; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 229, 255, 0.15); }
        .toggle-eye { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #666; cursor: pointer; font-size: 20px; }

        button { background: var(--primary); color: #000; border: none; padding: 18px; border-radius: 14px; font-weight: 700; font-size: 16px; cursor: pointer; margin-bottom: 12px; width: 100%; transition: 0.2s; }
        button:active { transform: scale(0.97); }
        .btn-outline { background: transparent; border: 1px solid #444; color: #aaa; }

        .card { background: var(--surface); padding: 20px; border-radius: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; animation: slideUp 0.4s ease forwards; }
        .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 10px 30px rgba(0, 229, 255, 0.3); cursor: pointer; }
    </style>
</head>
<body>

    <div id="setupScreen" class="screen active">
        <h1>Initialize</h1>
        <p style="color:#666; margin-bottom: 30px;">Create your unshakeable encryption key.</p>
        <input type="text" id="setupQ" placeholder="Security Question">
        <div class="input-wrapper">
            <input type="password" id="setupA" placeholder="Master Password">
            <i class="ph ph-eye toggle-eye" onclick="toggle('setupA', this)"></i>
        </div>
        <button onclick="doSetup()">Encrypt & Start</button>
        <button class="btn-outline" onclick="restoreFromCloud()">☁️ Restore Backup</button>
    </div>

    <div id="loginScreen" class="screen">
        <h1 id="loginLabel">Locked</h1>
        <p id="hintText" style="color:var(--primary); margin-bottom:30px;">...</p>
        <div class="input-wrapper">
            <input type="password" id="loginA" placeholder="Enter Password">
            <i class="ph ph-eye toggle-eye" onclick="toggle('loginA', this)"></i>
        </div>
        <button onclick="doLogin()">Unlock</button>
    </div>

    <div id="dashScreen" class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2>Vault</h2>
            <div style="display:flex; gap:10px;">
                <button onclick="showSettings()" style="width:auto; padding:10px 15px; margin:0; background:#222; color:white;">⚙️</button>
                <button onclick="location.reload()" style="width:auto; padding:10px 15px; margin:0; background:transparent; color:var(--danger); border:1px solid #ff2a2a; color:#ff2a2a;">LOCK</button>
            </div>
        </div>
        <input type="text" id="search" placeholder="🔍 Search..." oninput="render()">
        <button onclick="syncToCloud()" id="syncBtn" style="background: linear-gradient(45deg, #00e5ff, #2979ff);">☁️ Sync to Cloud</button>
        <div id="list" style="flex:1; overflow-y:auto; padding-bottom:80px;"></div>
        <div class="fab" onclick="showAdd()">+</div>
    </div>

    <div id="settingsScreen" class="screen">
        <h2>Settings</h2>
        <p style="color:#666;">Verify current password to change it.</p>
        <input type="password" id="oldPass" placeholder="Old Password">
        <hr style="border:0; border-top:1px solid #222; margin:20px 0;">
        <input type="text" id="newQ" placeholder="New Question">
        <input type="password" id="newPass" placeholder="New Password">
        <button onclick="doChangePass()">Update Credentials</button>
        <button class="btn-outline" onclick="showDash()">Cancel</button>
    </div>

    <div id="addScreen" class="screen">
        <h2>Add Entry</h2>
        <input type="text" id="nSite" placeholder="Site Name">
        <input type="text" id="nUser" placeholder="Username">
        <div class="input-wrapper">
            <input type="password" id="nPass" placeholder="Password">
            <i class="ph ph-eye toggle-eye" onclick="toggle('nPass', this)"></i>
        </div>
        <button onclick="saveEntry()">Save</button>
        <button class="btn-outline" onclick="showDash()">Cancel</button>
    </div>

    <script>
        const SB_URL = "https://qpfvtkyukvpbakm.supabase.co";
        const SB_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwZnZ0a3l1a3ZwYmFrbWNnbm1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzOTUxMzEsImV4cCI6MjA4Njk3MTEzMX0.9bcDnUc2kmAMKwCbitgkWTmq7NpjYAdHwlFb8GiuuDM";
        const DB_KEY = "vault_v5_secure"; 

        let db = [], key = null, question = "";

        window.onload = () => {
            const local = localStorage.getItem(DB_KEY);
            if(local) {
                try {
                    const p = JSON.parse(local);
                    question = p.q;
                    document.getElementById('hintText').innerText = "Hint: " + question;
                    show('loginScreen');
                } catch(e) { 
                    alert("Data error. Reinstall app."); 
                    localStorage.removeItem(DB_KEY);
                    location.reload();
                }
            }
        };

        async function genKey(pwd) {
            const enc = new TextEncoder();
            const km = await crypto.subtle.importKey("raw", enc.encode(pwd), {name:"PBKDF2"}, false, ["deriveKey"]);
            return crypto.subtle.deriveKey({name:"PBKDF2", salt:enc.encode("static_salt_v5"), iterations:100000, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["encrypt", "decrypt"]);
        }

        async function encrypt(data, k) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const enc = await crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, k || key, new TextEncoder().encode(JSON.stringify(data)));
            return { iv: Array.from(iv), d: Array.from(new Uint8Array(enc)) };
        }

        async function decrypt(pack, k) {
            try {
                const dec = await crypto.subtle.decrypt({name:"AES-GCM", iv:new Uint8Array(pack.iv)}, k || key, new Uint8Array(pack.d));
                return JSON.parse(new TextDecoder().decode(dec));
            } catch(e) { return null; }
        }

        async function doSetup() {
            question = document.getElementById('setupQ').value;
            const ans = document.getElementById('setupA').value;
            if(!question || !ans) return alert("All fields required");
            key = await genKey(ans);
            db = []; await saveLocal(); showDash();
        }

        async function doLogin() {
            const ans = document.getElementById('loginA').value;
            if(!ans) return;
            const tempKey = await genKey(ans);
            const raw = JSON.parse(localStorage.getItem(DB_KEY));
            const res = await decrypt(raw.data, tempKey);
            if(res) { 
                db = res; 
                key = tempKey; 
                showDash(); 
            } else alert("Incorrect Password");
        }

        async function saveEntry() {
            db.push({ id:Date.now(), s:document.getElementById('nSite').value, u:document.getElementById('nUser').value, p:document.getElementById('nPass').value });
            await saveLocal(); 
            document.getElementById('nSite').value=""; document.getElementById('nUser').value=""; document.getElementById('nPass').value="";
            showDash();
        }

        async function saveLocal() {
            const enc = await encrypt(db);
            localStorage.setItem(DB_KEY, JSON.stringify({ q: question, data: enc }));
            render();
        }

        async function syncToCloud() {
            const btn = document.getElementById('syncBtn'); btn.innerText = "⏳ Connecting...";
            const local = JSON.parse(localStorage.getItem(DB_KEY));
            
            try {
                // Tries 'Vault' (Capital V) first
                const res = await fetch(`${SB_URL}/rest/v1/Vault`, {
                    method: 'POST',
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: 'me', encrypted_data: JSON.stringify(local.data), question: local.q })
                });

                if(res.ok) {
                    btn.innerText = "✅ Synced!"; 
                    setTimeout(()=>btn.innerText="☁️ Sync to Cloud", 2000);
                } else {
                    if(res.status === 401 || res.status === 403) {
                        alert("🔒 BLOCKED BY SUPABASE (RLS)\n\nSolution: Go to Supabase > Table Editor. Click 'Disable RLS' button.");
                    } else if(res.status === 404) {
                        alert("🚫 TABLE NOT FOUND (404)\n\nSolution: In Supabase, rename your table to 'Vault' (Capital V).");
                    } else {
                        alert(`❌ Error Code: ${res.status}`);
                    }
                    btn.innerText = "❌ Failed";
                }
            } catch(e) { 
                alert("Network Error: Check internet."); 
                btn.innerText = "❌ Error"; 
            }
        }

        async function restoreFromCloud() {
            try {
                const res = await fetch(`${SB_URL}/rest/v1/Vault?user_id=eq.me&select=*&order=id.desc&limit=1`, { headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` } });
                const rows = await res.json();
                if(rows.length) {
                    localStorage.setItem(DB_KEY, JSON.stringify({ q: rows[0].question, data: JSON.parse(rows[0].encrypted_data) }));
                    location.reload();
                } else alert("No backup found.");
            } catch(e) { alert("Restore failed. Check RLS."); }
        }

        async function doChangePass() {
            const oldP = document.getElementById('oldPass').value;
            const newQ = document.getElementById('newQ').value;
            const newP = document.getElementById('newPass').value;
            if(!oldP || !newQ || !newP) return alert("Fill all fields");
            const oldKeyCheck = await genKey(oldP);
            const raw = JSON.parse(localStorage.getItem(DB_KEY));
            const verify = await decrypt(raw.data, oldKeyCheck);
            if(verify) {
                key = await genKey(newP);
                question = newQ;
                await saveLocal();
                alert("Success! Password updated.");
                showDash();
            } else alert("Old password incorrect.");
        }

        function show(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); if(id=='dashScreen') render(); }
        function showDash() { show('dashScreen'); }
        function showAdd() { show('addScreen'); }
        function showSettings() { show('settingsScreen'); }
        function toggle(id, icon) { const x = document.getElementById(id); x.type = x.type === "password" ? "text" : "password"; icon.classList.toggle("ph-eye-slash"); }
        function render() {
            const list = document.getElementById('list'); list.innerHTML = "";
            const term = document.getElementById('search').value.toLowerCase();
            db.filter(i => i.s.toLowerCase().includes(term)).forEach((i, idx) => {
                const d = document.createElement('div'); d.className='card'; d.style.animationDelay = (idx * 0.05) + 's'; 
                d.innerHTML = `<div><b>${i.s}</b><small>${i.u}</small></div><button style="width:auto;margin:0;padding:8px 15px;background:#222;" onclick="navigator.clipboard.writeText('${i.p}');alert('Copied')">Copy</button>`;
                list.appendChild(d);
            });
        }
    </script>
</body>
            </html>
